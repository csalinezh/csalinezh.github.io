name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - source

jobs:
  github-pages:
    runs-on: ubuntu-slim
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build site
        run: |
          bundle exec jekyll build --trace \
            --destination "$RUNNER_TEMP/site"
      - name: Publish to master
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-site.sh "$RUNNER_TEMP/site"
